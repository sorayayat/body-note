name: Workout Log Windows preview

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test preview logic
        if: ${{ !cancelled() }}
        run: node --test Preview/tests/*.test.cjs
      - name: Exercise the main journal journey in Edge
        if: ${{ !cancelled() }}
        run: node Scripts/check-preview.mjs
      - name: Check restoration and concurrent edits in Edge
        if: ${{ !cancelled() }}
        run: node --test Scripts/preview-regressions.test.mjs
