name: Workout Log Windows preview

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test preview logic
        if: ${{ !cancelled() }}
        run: node --test Preview/tests/*.test.cjs
      - name: Exercise the main journal journey in Edge
        if: ${{ !cancelled() }}
        run: node Scripts/check-preview.mjs
      - name: Check navigation, restoration and concurrent edits in Edge
        if: ${{ !cancelled() }}
        env:
          WORKOUT_PREVIEW_SCREENSHOTS: ${{ runner.temp }}/workout-preview-screens
        run: node --test Scripts/preview-regressions.test.mjs
      - name: Publish the tested Windows screens
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: WorkoutLog-Windows-Screens
          path: ${{ runner.temp }}/workout-preview-screens/*.png
          if-no-files-found: error
          retention-days: 14
