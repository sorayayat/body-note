name: Workout Log iOS

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Test notebook, tracking and coaching
        run: swift test --package-path BodyNoteCore
      - name: Build for iPhone and test on a simulator
        run: bash Scripts/test-ios-beta.sh
        env:
          WORKOUT_UI_RESULT_PATH: ${{ runner.temp }}/WorkoutLog.xcresult
      - name: Retain failed simulator results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: WorkoutLog-UI-failure
          path: ${{ runner.temp }}/WorkoutLog.xcresult
          if-no-files-found: ignore
          retention-days: 7
