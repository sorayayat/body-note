name: Body Note iOS

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test browser preview
        run: node --test Preview/tests/*.test.cjs
      - name: Test notebook and adventure rules
        run: swift test --package-path BodyNoteCore
      - name: Build the iPhone app
        run: >
          xcodebuild -project BodyNote.xcodeproj -scheme BodyNote
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
